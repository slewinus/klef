name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to associate (only used when triggered manually for dry runs)'
        required: false
        default: 'v0.0.0-dispatch'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-latest
            os: macos
            native: false          # cross-compiled from the arm64 runner
          - target: aarch64-apple-darwin
            runner: macos-latest
            os: macos
            native: true
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            os: linux
            native: true
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            os: linux
            native: true

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="${{ github.event.inputs.tag }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $tag"

      - name: Install Linux build dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # `--features mcp` is NOT optional here: without it the published binaries
      # have no `klef mcp` subcommand, which is what users wire into Claude Code
      # and Codex. It shipped missing from v0.4.0 through v0.4.3 because this
      # line didn't have it while the GUI's CI job did — so the binary bundled
      # in the .app had MCP and every tarball didn't. The verify step below
      # exists so that can't happen silently again.
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p klef --features mcp

      - name: Verify the mcp subcommand is present
        if: matrix.native
        run: |
          BIN="target/${{ matrix.target }}/release/klef"
          "$BIN" mcp --help > /dev/null || {
            echo "::error::built binary has no 'mcp' subcommand — --features mcp missing?"
            exit 1
          }
          echo "✓ $BIN exposes 'klef mcp'"

      - name: Strip binary
        run: |
          BIN_PATH="target/${{ matrix.target }}/release/klef"
          if [ "${{ matrix.os }}" = "macos" ]; then
            strip "$BIN_PATH"
          else
            strip "$BIN_PATH" || true
          fi

      - name: Package tarball
        id: pkg
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          TARGET="${{ matrix.target }}"
          PKG_NAME="klef-${TAG}-${TARGET}"
          mkdir -p "dist/${PKG_NAME}"
          cp "target/${TARGET}/release/klef" "dist/${PKG_NAME}/"
          cp LICENSE README.md CHANGELOG.md "dist/${PKG_NAME}/"
          tar -C dist -czf "dist/${PKG_NAME}.tar.gz" "${PKG_NAME}"
          echo "tarball=dist/${PKG_NAME}.tar.gz" >> "$GITHUB_OUTPUT"
          ( cd dist && shasum -a 256 "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256" )
          ls -la dist/

      - name: Upload artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  gui:
    name: macOS GUI (.dmg)
    runs-on: macos-latest
    # Exposed at job level so the two build steps below can branch on whether
    # signing is configured. A step `if:` can read `env`, but not `secrets`.
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="${{ github.event.inputs.tag }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: gui-aarch64-apple-darwin

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: crates/klef-gui/package-lock.json

      - name: Install frontend dependencies
        working-directory: crates/klef-gui
        run: npm ci

      # The .app ships the CLI inside it (Resources/cli-bundle/klef) so one
      # cask install gives both. `--features mcp` for the same reason the
      # tarball build needs it: without it the bundled CLI has no `klef mcp`.
      - name: Stage the klef CLI for bundling
        run: |
          cargo build --release --locked -p klef --features mcp
          mkdir -p crates/klef-gui/cli-bundle
          cp target/release/klef crates/klef-gui/cli-bundle/klef
          ./crates/klef-gui/cli-bundle/klef mcp --help > /dev/null || {
            echo "::error::CLI staged for the .app has no 'mcp' subcommand"
            exit 1
          }

      # Notarization rejects a bundle if ANY Mach-O inside it isn't properly
      # signed. tauri signs the .app and its own binaries, but cli-bundle/klef
      # is a plain copied file it doesn't touch, so Apple returned three errors
      # against it: no Developer ID, no secure timestamp, no hardened runtime.
      # It has to be signed here, before tauri seals the bundle around it —
      # which means importing the certificate ourselves rather than waiting for
      # tauri to do it during the build.
      - name: Import the signing certificate
        if: env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/klef-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain

      - name: Sign the bundled CLI
        if: env.APPLE_CERTIFICATE != ''
        run: |
          codesign --force --options runtime --timestamp \
            --sign "${{ secrets.APPLE_SIGNING_IDENTITY }}" \
            crates/klef-gui/cli-bundle/klef
          # Assert the three things notarization checks, so a regression fails
          # here in seconds instead of after a round trip to Apple.
          out="$(codesign -dvvv crates/klef-gui/cli-bundle/klef 2>&1)"
          echo "$out" | grep -q 'flags=.*runtime' || {
            echo "::error::bundled CLI lacks the hardened runtime"; exit 1; }
          echo "$out" | grep -q '^Authority=Developer ID Application' || {
            echo "::error::bundled CLI is not signed with a Developer ID"; exit 1; }
          echo "$out" | grep -q '^Timestamp=' || {
            echo "::error::bundled CLI signature has no secure timestamp"; exit 1; }
          echo "✓ bundled CLI: Developer ID, hardened runtime, secure timestamp"

      # Two build steps rather than one with conditional env: a half-populated
      # signing config fails deep inside the bundler at release time, which is
      # the worst moment to debug it. Either every secret is present and we
      # sign + notarize, or none is and we ship the same unsigned bundle as
      # before. Tauri imports the .p12 itself when APPLE_CERTIFICATE is set.
      - name: Build signed + notarized .dmg
        if: env.APPLE_CERTIFICATE != ''
        working-directory: crates/klef-gui
        run: npx tauri build --target aarch64-apple-darwin
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build unsigned .dmg
        if: env.APPLE_CERTIFICATE == ''
        working-directory: crates/klef-gui
        run: |
          echo "::warning::APPLE_CERTIFICATE not set — shipping an unsigned .dmg."
          echo "::warning::macOS will quarantine it; the cask keeps its xattr caveat."
          npx tauri build --target aarch64-apple-darwin

      - name: Package .dmg
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          SRC="$(find target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' | head -1)"
          [ -n "$SRC" ] || { echo "::error::no .dmg produced"; exit 1; }
          mkdir -p dist
          OUT="klef-gui-${TAG}-aarch64-apple-darwin.dmg"
          cp "$SRC" "dist/${OUT}"
          ( cd dist && shasum -a 256 "$OUT" > "${OUT}.sha256" )
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gui-dmg
          path: |
            dist/*.dmg
            dist/*.sha256

  release:
    name: Publish GitHub Release
    needs: [build, gui]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact tree
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.dmg' -o -name '*.sha256' \) -exec mv {} release-files/ \;
          ls -la release-files/

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
          fail_on_unmatched_files: true
